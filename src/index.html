<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Yoyo's field notes: engineering, research, novels, and places traversed.">
    <title>adiabatic.garden — Yoyo</title>
    <link rel="stylesheet" href="css/garden.css">
    <link rel="stylesheet" href="css/research.css">
    <script src="js/garden.js" type="module"></script>
  </head>
  <body>
    <template id="note-intro"><h1>Yoyo. explorer!</h1>{{ homepage.intro | safe }}</template>
    <template id="note-writing">{% include "home-writing.njk" %}</template>
    <template id="note-research">{{ homepage.research | safe }}</template>
    <template id="note-places">{{ homepage.places | safe }}</template>
    <template id="note-shelves">{{ homepage.shelves | safe }}</template>
    <template id="note-friends">{{ homepage.friends | safe }}</template>
    <div class="landscape" aria-hidden="true"></div>
    <div class="desktop">
      <header class="masthead">
        <a class="site-name" href="./">adiabatic.garden <span>φ</span></a>
        <span class="masthead-note">engineering · novels · exploration</span>
        <button id="scenery" type="button" aria-pressed="false">View scenery</button>
      </header>
      <div class="frame">
        <nav class="rail" aria-label="Open sections">
          <div id="section-menu"></div>
          <div class="rail-end">
            <a class="rail-button" href="/archive/" aria-label="Archives" data-icon="archive"></a>
            <button id="reset-layout" class="rail-button" type="button" aria-label="Reset layout" data-icon="grid"></button>
          </div>
        </nav>
        <main id="workspace" class="workspace" aria-label="Yoyo's field notes">
          <p class="loading" role="status">Opening field notes…</p>
        </main>
      </div>
      <noscript>
        <p class="no-script"><a href="/about/">About</a> · <a href="/writing/">Writing</a> · <a href="/pages/bookshelf/">Bookshelf</a> · <a href="/pages/blog-roll/">Friends</a></p>
      </noscript>
      <footer class="desktop-footer">
        <span>Yoyo · field notes, in progress</span>
        <a href="mailto:hi@adiabatic.garden">hi@adiabatic.garden ↗</a>
      </footer>
    </div>
  </body>
</html>
